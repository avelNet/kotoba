<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Котоба</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fbfaf7);
    --card: var(--tg-theme-secondary-bg-color, #f1eee8);
    --text: var(--tg-theme-text-color, #1d1b18);
    --muted: var(--tg-theme-hint-color, #8a847a);
    --accent: #d1453b;
    --btn: var(--tg-theme-button-color, #d1453b);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --line: rgba(127, 120, 110, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--tg-theme-bg-color, #171614);
      --card: var(--tg-theme-secondary-bg-color, #24221f);
      --text: var(--tg-theme-text-color, #eeeae3);
      --muted: var(--tg-theme-hint-color, #968f84);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; gap: 12px; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .accent { color: var(--accent); } .center { text-align: center; }
  .row { display: flex; justify-content: space-between; align-items: center; } .gap { gap: 8px; }
  h2, h3 { margin: 8px 0 0; } h3 { font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

  .hero { display: flex; gap: 14px; align-items: center; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 600 22px "Hiragino Mincho ProN", serif; letter-spacing: -1px; }
  .title { font-size: 22px; font-weight: 700; }
  .today { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px; text-align: center; }
  .num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .btn { appearance: none; border: 0; border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 600; background: var(--card); color: var(--text); cursor: pointer; }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--btn); color: var(--btn-text); }
  .btn.big { width: 100%; padding: 16px; font-size: 17px; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.danger { color: #e5484d; }
  .done { background: var(--card); border-radius: 14px; padding: 16px; text-align: center; font-weight: 600; }

  .deck { background: var(--card); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .deck.locked { opacity: .55; }
  .deck.playable { cursor: pointer; }
  .deck.playable:active { transform: scale(.99); }
  .deck-top { display: flex; justify-content: space-between; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }

  .progress { display: flex; flex-direction: column; gap: 6px; }
  .card { position: relative; background: var(--card); border-radius: 20px; padding: 28px 18px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 300px; }
  .front { font-size: 88px; line-height: 1.1; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;  }
  .front.word { font-size: clamp(22px, calc((min(100vw, 520px) - 84px) / var(--len, 4)), 44px); overflow-wrap: anywhere; }
  .sep { height: 1px; background: var(--line); margin: 6px 20px; }
  .answer { font-size: 24px; font-weight: 600; }
  .kanji-form { font-size: 34px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .readings { display: flex; flex-direction: column; gap: 4px; font-size: 18px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 4px; vertical-align: middle; }
  .examples { text-align: left; font-size: 15px; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .ex .jp { font-size: 18px; }
  .placeholder { font-size: 16px; padding: 18px 0; }
  .icon { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; font-size: 22px; padding: 8px; cursor: pointer; }
  .hint { text-align: center; }

  .actions { display: flex; gap: 8px; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); }
  .grades.two { grid-template-columns: 1fr 1fr; }
  .grades.two .grade { padding: 16px 4px; font-size: 16px; }
  .pick { display: flex; justify-content: space-between; text-align: left; }
  .grade { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; font-size: 14px; }
  .grade span { font-size: 12px; font-weight: 500; opacity: .75; }
  .g0 { background: rgba(229, 72, 77, .16); color: #e5484d; }
  .g1 { background: rgba(232, 150, 30, .16); color: #d68512; }
  .g2 { background: rgba(48, 164, 108, .16); color: #2b9a64; }
  .g3 { background: rgba(62, 99, 221, .16); color: #4a6fe0; }

  .finish { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; }
  .big-emoji { font-size: 64px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 10px 14px; }
  .set-row input[type=number] { width: 70px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); text-align: center; }
  .set-row input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  textarea { width: 100%; font: 12px ui-monospace, monospace; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); resize: vertical; }
  #sync.warn { color: #d68512; }
  body.has-tabs #app { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--bg); border-top: 1px solid var(--line); padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  #tabs[hidden] { display: none; }
  #tabs button { appearance: none; border: 0; background: none; color: var(--muted); font: 600 11px/1.2 inherit; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; cursor: pointer; }
  #tabs .ti { font-size: 20px; line-height: 1.1; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #tabs button[aria-current="page"] { color: var(--accent); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { appearance: none; border: 0; border-radius: 9px; padding: 9px 6px; background: none; color: var(--text); font: 600 14px inherit; font-family: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .search { width: 100%; font: 16px inherit; font-family: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .dict { display: flex; flex-direction: column; background: var(--card); border-radius: 14px; overflow: hidden; }
  .drow { appearance: none; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; }
  .drow + .drow { border-top: 1px solid var(--line); }
  .drow:active { background: var(--line); }
  .dk { display: flex; flex-direction: column; min-width: 0; }
  .dkana { font-size: 20px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .dkanji { font-size: 13px; color: var(--muted); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .dru { font-size: 14px; min-width: 0; }
  .dots { font-size: 10px; letter-spacing: 1px; color: var(--accent); white-space: nowrap; }
  .seg button { font-size: 13px; padding: 9px 2px; }
  .addbox { display: flex; flex-direction: column; gap: 8px; background: var(--card); border-radius: 14px; padding: 12px; }
  .addbox .search { background: var(--bg); }
  .addrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bulk summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; padding: 4px 0; }
  .bulk[open] { display: flex; flex-direction: column; gap: 8px; }
  .bulk textarea { font: 16px inherit; font-family: inherit; background: var(--bg); }
  .drow.mine { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto auto; }
  .dact { display: flex; gap: 2px; }
  .dedit { appearance: none; border: 0; background: none; color: var(--muted); font: 600 15px inherit; font-family: inherit; padding: 6px; cursor: pointer; }
  .editrow { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .editrow .search { background: var(--bg); }
  .editrow .row .btn { flex: 1; }
  .ddel { appearance: none; border: 0; background: none; color: var(--muted); font: 600 14px inherit; font-family: inherit; padding: 6px; cursor: pointer; }
  .ddel.armed { color: #e5484d; }
  .pstats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .num.sm { font-size: 22px; }
  .ptotal { display: flex; justify-content: space-between; align-items: baseline; background: var(--card); border-radius: 14px; padding: 14px; }
  .ptotal b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: var(--card); border-radius: 14px; padding: 14px 10px 10px; }
  .chart .col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chart .bars { height: 110px; width: 100%; max-width: 28px; display: flex; flex-direction: column-reverse; border-radius: 6px; background: var(--line); overflow: hidden; }
  .chart .bars i { display: block; width: 100%; }
  .chart i.a, .legend i.a { background: var(--accent); }
  .chart i.m, .legend i.m { background: #4a6fe0; }
  .chart .v { font-size: 11px; font-variant-numeric: tabular-nums; min-height: 14px; }
  .chart .col.today .muted { color: var(--accent); font-weight: 700; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .addtime { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .addtime .btn { padding: 12px 4px; }
  .row.gap .search { flex: 1; min-width: 0; }
  .linkbtn { appearance: none; border: 0; background: none; color: var(--accent); font: inherit; padding: 0; cursor: pointer; text-decoration: underline; }
  .pcounts { display: flex; flex-direction: column; gap: 6px; }
  .phead { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; background: var(--card); border-radius: 20px; padding: 22px 16px 16px; }
  .phead.flat { background: none; padding: 4px; }
  .phead .gear { position: absolute; top: 8px; right: 8px; font-size: 22px; color: var(--muted); }
  .ava { border-radius: 50%; object-fit: cover; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-family: "Hiragino Mincho ProN", "Noto Serif JP", serif; flex: none; }
  .pname { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .pabout { margin: 2px 0 0; max-width: 40ch; overflow-wrap: anywhere; }
  .pbadges { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 4px; }
  .badge { font-size: 13px; background: var(--bg); border-radius: 999px; padding: 5px 10px; }
  .small-btn { padding: 8px 14px; font-size: 14px; margin-top: 6px; background: var(--bg); }
  .pstats.three { grid-template-columns: repeat(3, 1fr); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field textarea { font: 16px inherit; font-family: inherit; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { appearance: none; border: 2px solid transparent; background: var(--card); color: var(--text); width: 44px; height: 44px; border-radius: 12px; font: 22px "Hiragino Mincho ProN", "Noto Serif JP", serif; cursor: pointer; }
  .chip.on { border-color: var(--accent); }
  .dot { appearance: none; border: 3px solid transparent; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
  .dot.on { border-color: var(--text); }
  .filebtn { text-align: center; cursor: pointer; }
  .loading { flex: 1; display: grid; place-items: center; color: var(--muted); }
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>
<nav id="tabs" hidden>
  <button data-tab="home" aria-current="page"><span class="ti">家</span><span>Главная</span></button>
  <button data-tab="dict"><span class="ti">辞</span><span>Словарь</span></button>
  <button data-tab="profile"><span class="ti">私</span><span>Профиль</span></button>
</nav>
<script src="data.js?v=17"></script>
<script src="app.js?v=17"></script>
</body>
</html>
